[project]
name = "lectura"
version = "0.1.0"
description = "Turn photographs of lecture material into structured, editable study notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
lectura = "lectura.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectura"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is expressed as call-valued defaults.
"src/lectura/api/server.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
